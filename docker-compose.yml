services:
  floci:
    image: floci/floci:latest
    container_name: cqrs-floci
    ports:
      - "4566:4566"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4566/_floci/health"]
      interval: 2s
      timeout: 3s
      retries: 30

  init:
    image: amazon/aws-cli:latest
    container_name: cqrs-init
    depends_on:
      floci:
        condition: service_healthy
    environment:
      AWS_ENDPOINT_URL: http://floci:4566
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    volumes:
      - ./scripts/init.sh:/init.sh:ro
    entrypoint: ["/bin/sh", "/init.sh"]

  worker:
    image: python:3.12-slim
    container_name: cqrs-worker
    depends_on:
      init:
        condition: service_completed_successfully
    environment:
      AWS_ENDPOINT_URL: http://floci:4566
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    volumes:
      - ./demo:/app:ro
    working_dir: /app
    command: ["sh", "-c", "pip install -q boto3 && python -u projection_worker.py"]
    restart: unless-stopped
